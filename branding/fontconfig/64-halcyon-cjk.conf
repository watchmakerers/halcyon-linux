<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Halcyon: Chinese, Japanese and Korean text in Source Han Sans, the CJK
     companion to the desktop's Source Sans 3 (as Meiryo was to Segoe UI).
     Untagged text uses the Japanese glyph forms; text tagged with a language
     gets that region's forms of the shared Han characters. -->
<fontconfig>
  <alias binding="same">
    <family>Source Sans 3</family>
    <default><family>sans-serif</family></default>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Source Han Sans</family></prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer><family>Source Han Sans</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>Source Han Sans</family></prefer>
  </alias>

  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <edit name="family" mode="prepend"><string>Source Han Sans K</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-cn</string></test>
    <edit name="family" mode="prepend"><string>Source Han Sans SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-sg</string></test>
    <edit name="family" mode="prepend"><string>Source Han Sans SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-tw</string></test>
    <edit name="family" mode="prepend"><string>Source Han Sans TC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-hk</string></test>
    <edit name="family" mode="prepend"><string>Source Han Sans HC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh-mo</string></test>
    <edit name="family" mode="prepend"><string>Source Han Sans HC</string></edit>
  </match>
</fontconfig>
